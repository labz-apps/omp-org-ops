name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Syntax check
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Lint
        run: shellcheck --severity=warning scripts/*.sh

      - name: Self-test provision, show, unset
        env:
          NPM_TOKEN: npm_000000000000000000000000000000000000
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/npmrc-test/.npmrc"

          ./scripts/npm-auth.sh provision --npmrc "$npmrc"
          ./scripts/npm-auth.sh show --npmrc "$npmrc"

          mode="$(stat -c '%a' "$npmrc" 2>/dev/null || stat -f '%Lp' "$npmrc")"
          [ "$mode" = "600" ] || { echo "npmrc mode is $mode, want 600"; exit 1; }

          lines="$(grep -c '_authToken=' "$npmrc")"
          [ "$lines" = "1" ] || { echo "expected 1 token line, found $lines"; exit 1; }

          NPM_TOKEN=npm_111111111111111111111111111111111111 \
            ./scripts/npm-auth.sh provision --npmrc "$npmrc"
          lines="$(grep -c '_authToken=' "$npmrc")"
          [ "$lines" = "1" ] || { echo "provision is not idempotent: $lines token lines"; exit 1; }

          printf '%s' npm_222222222222222222222222222222222222 \
            | ./scripts/npm-auth.sh provision --token-stdin --npmrc "$npmrc"
          grep -q '^//registry.npmjs.org/:_authToken=npm_222222222222222222222222222222222222$' "$npmrc"

          printf '%s\n%s\n' \
            '//registry.npmjs.org:_authToken=npm_333333333333333333333333333333333333' \
            '//registry.npmjs.org/:_authToken=npm_444444444444444444444444444444444444' \
            'fund=false' >"$npmrc"
          ./scripts/npm-auth.sh provision --npmrc "$npmrc" >/dev/null
          lines="$(grep -c '_authToken=' "$npmrc")"
          [ "$lines" = "1" ] || { echo "provision left $lines token lines"; exit 1; }
          grep -q '^//registry.npmjs.org/:_authToken=npm_' "$npmrc"
          grep -q '^fund=false$' "$npmrc" || { echo "provision dropped unrelated settings"; exit 1; }

          # Point HOME at an npmrc that must survive, so an unset that ignores
          # --npmrc fails here instead of quietly editing the wrong file.
          printf '%s\n' '//registry.npmjs.org/:_authToken=npm_555555555555555555555555555555555555' \
            >"$RUNNER_TEMP/decoy.npmrc"
          HOME="$RUNNER_TEMP/decoy-home" NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/decoy.npmrc" \
            ./scripts/npm-auth.sh provision --npmrc "$npmrc" >/dev/null
          grep -q '_authToken=' "$RUNNER_TEMP/decoy.npmrc"

          HOME="$RUNNER_TEMP/decoy-home" NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/decoy.npmrc" \
            ./scripts/npm-auth.sh unset --npmrc "$npmrc" >/dev/null

          lines="$(grep -c '_authToken=' "$RUNNER_TEMP/decoy.npmrc" || true)"
          [ "$lines" = "1" ] || { echo "unset ignored --npmrc and edited the default npmrc"; exit 1; }

          lines="$(grep -c '_authToken=' "$npmrc" || true)"
          [ "$lines" = "0" ] || { echo "unset left $lines token lines"; exit 1; }
          [ "$(stat -c '%a' "$npmrc" 2>/dev/null || stat -f '%Lp' "$npmrc")" = "600" ]

      - name: Self-test the release gate, offline
        run: |
          set -euo pipefail
          gate=./scripts/npm-release-gate.sh
          pkg="$RUNNER_TEMP/gate"

          # A missing manifest fails and does not invent a package name.
          out="$($gate --package-dir "$RUNNER_TEMP/no-such-dir" 2>&1)" && {
            echo "expected a missing manifest to fail"; exit 1;
          }
          printf '%s' "$out" | grep -q 'manifest       \[fail\] no package.json'

          # A malformed manifest is reported as such.
          mkdir -p "$pkg/broken"
          printf 'not json at all\n' >"$pkg/broken/package.json"
          out="$($gate --package-dir "$pkg/broken" 2>&1)" && {
            echo "expected a malformed manifest to fail"; exit 1;
          }
          printf '%s' "$out" | grep -q 'manifest       \[fail\]'

          # A manifest with no version cannot be released.
          mkdir -p "$pkg/no-version"
          printf '{"name":"@buckeyestudio/toh"}\n' >"$pkg/no-version/package.json"
          out="$($gate --package-dir "$pkg/no-version" 2>&1)" && {
            echo "expected a versionless manifest to fail"; exit 1;
          }

          # oh-my-pi's root manifest is private, so npm would refuse it.
          mkdir -p "$pkg/private"
          printf '{"name":"omp","version":"0.0.0","private":true}\n' >"$pkg/private/package.json"
          out="$($gate --package-dir "$pkg/private" --approved-by board 2>&1)" && {
            echo "expected a private manifest to fail"; exit 1;
          }
          printf '%s' "$out" | grep -q 'not_private    \[fail\] omp is marked private'

          # An unapproved release never gates green.
          out="$($gate --package @buckeyestudio/toh@9.9.9 2>&1)" && {
            echo "expected an unapproved release to fail"; exit 1;
          }
          printf '%s' "$out" | grep -q 'approval       \[fail\] no approval recorded'

          # An approved release does gate green.
          $gate --package @buckeyestudio/toh@9.9.9 --approved-by board >/dev/null

          # The gate reports, it does not upload: consulting the registry must
          # surface a version_free check, and reject one that is already taken.
          if npm view @buckeyestudio/toh-invariants@0.1.1-rc.2 version >/dev/null 2>&1; then
            out="$($gate --package @buckeyestudio/toh-invariants@0.1.1-rc.2 \
              --approved-by board --check-registry 2>&1)" && {
              echo "expected an already-published version to fail"; exit 1;
            }
            printf '%s' "$out" | grep -q 'version_free   \[fail\]'
          else
            echo "::notice::registry unreachable or fixture absent, skipping the taken-version assert"
            $gate --package @buckeyestudio/toh@9.9.9 --approved-by board \
              --check-registry >/dev/null
          fi

          # An unreachable registry must not read as "the version is free".
          if out="$(NPM_REGISTRY=https://registry.invalid/ \
            $gate --package @buckeyestudio/toh@9.9.9 --approved-by board \
            --check-registry 2>&1)"; then
            echo "expected an unreachable registry to fail, not to pass"
            exit 1
          fi
          printf '%s' "$out" | grep -q 'version_free   \[fail\]'

          # Usage errors are distinguishable from check failures.
          $gate --package bogus >/dev/null 2>&1 && {
            echo "expected a versionless --package to be a usage error"; exit 1;
          } || [ "$?" = "2" ]
          $gate --nonsense >/dev/null 2>&1 && {
            echo "expected an unknown flag to be a usage error"; exit 1;
          } || [ "$?" = "2" ]

          # A report records the approval and states that nothing was uploaded.
          $gate --package @buckeyestudio/toh@9.9.9 --approved-by board \
            --report "$RUNNER_TEMP/gate-report" >/dev/null
          grep -q '^approved_by=board$' "$RUNNER_TEMP/gate-report/npm-release-gate-report.txt"
          grep -q '^result=pass$' "$RUNNER_TEMP/gate-report/npm-release-gate-report.txt"
          grep -q '^uploaded=no$' "$RUNNER_TEMP/gate-report/npm-release-gate-report.txt"

          # The gate must never be able to upload, whatever it is handed.
          if grep -qE 'npm +publish|npm +unpublish|npm +dist-tag|npm +deprecate' scripts/npm-release-gate.sh; then
            echo "the release gate must not contain an upload command"
            exit 1
          fi

      - name: Self-test rejects a malformed token
        run: |
          set -euo pipefail
          if NPM_TOKEN=not-a-token ./scripts/npm-auth.sh provision \
            --npmrc "$RUNNER_TEMP/npmrc-bad/.npmrc"; then
            echo "expected a malformed token to be rejected"
            exit 1
          fi
          [ ! -f "$RUNNER_TEMP/npmrc-bad/.npmrc" ]

      - name: Self-test reports a missing token
        run: |
          set -euo pipefail
          if HOME="$RUNNER_TEMP/empty-home" NPM_TOKEN= \
            ./scripts/npm-verify-auth.sh --probe; then
            echo "expected verify to fail without a token"
            exit 1
          fi

      - name: No credential is committed
        run: |
          set -euo pipefail
          # This workflow holds the dummy tokens the self-test provisions, so it
          # is the one file allowed to contain a token-shaped string.
          if git grep -nE 'npm_[A-Za-z0-9]{20,}' -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "a token-shaped string is committed; rotate it"
            exit 1
          fi